apiVersion: apps/v1
kind: Deployment
metadata:
  name: gta6-news-hub
  labels:
    app: gta6-news-hub
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gta6-news-hub
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: gta6-news-hub
    spec:
      containers:
        - name: app
          image: gta6-news-hub:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
