<!DOCTYPE html>
<html lang="en" data-theme="dark" data-accent="pink">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — GTA 6 News Hub</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { display: grid; place-items: center; min-height: 100vh; text-align: center; }
    .offline { max-width: 460px; padding: 2rem; }
    .offline .mark { font-size: 4rem; font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
  </style>
</head>
<body>
  <div class="offline">
    <div class="mark">VI</div>
    <h1>You're offline</h1>
    <p class="muted">No connection right now. Previously viewed GTA 6 news is still available from cache — reconnect to get the latest drops.</p>
    <p><a class="btn btn-primary" href="./index.html">Try again</a></p>
  </div>
</body>
</html>
