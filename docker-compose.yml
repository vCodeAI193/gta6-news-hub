version: "3.9"
services:
  app:
    build: .
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/data/gta6hub.db
    volumes:
      - ./data:/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html:ro
